name: Android Debug APK

on:
  push:
    branches: ["main", "icon-final"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Add Safir cinematic videos
        shell: bash
        run: |
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 'https://files2.heygen.ai/aws_pacific/avatar_tmp/c9ff2ee1fa774b72867af9af69c824cd/v77dafbe05b6c4a3499cd6a5b9430193d/1654ff3f875540c48fd8c014175a14e1.mp4?Expires=1788260859&Signature=eTCIO3gf~wAB8a-U2PAp7PlVQSrFtaSSDu5vcaFElqvqtFnnvz7IcSgcTf-2oYmd07serQyPdqLw0GVdKN5BG0fCRk4GMfKXy79dx-OuDYO1xUTkIOmM5ARrvDVccdifFBVE6caCAkjLvlZOQHNF1AWEDDMdT2REqI7FAulXS4DYdCln97LnAwA80y0eXu6WW23V-mJcbT~i1eI7PicB9rtEo3AW~T7NrJsnacXoxsZPCAfUtm038OtmZ6PciWocdQazF8pwdesgN0BO8n1zELmTipXWD57ZcmBiyMc7hOpZXsNLQTUzdPvdbf9zfTEfXrtZrum2t0cg~57sYk7Fhw__&Key-Pair-Id=K38HBHX5LX3X2H' -o app/src/main/res/raw/safir_home_loop.mp4
          curl -L --fail --retry 3 'https://files2.heygen.ai/aws_pacific/avatar_tmp/c9ff2ee1fa774b72867af9af69c824cd/vc95532da13fe4ad087a9e8faac454062/8d8ef06f8c294ff4a33151335bbe36d9.mp4?Expires=1788263618&Signature=L~ht59pc3p24PMzo6dzS9KnKfmhmmXcwnUpgL2KiCqahFGMLFeRcIemuCbxusvEyfo9LvzEU-px0fVqdl9gkU2fqnZv5AKdvvwQ8Pe5EQfjOQsmeRH50Rey5zJhbVRDFer-xQ5oBfnVfWo-2lD7TIA7ehLQRCTIUGqAIhx0LSgerwnsF6TorIxyY2z4~VTKgj9uNJINFLL~d7ATc4Aj~bTHvdsUp~6TQlYgsyDK4bBvBV-rbDKDNSa2B520-HRx1UbFAuEfC2IjsJUIt0ksb7STvUdiwHm4WwJfIMw7eizyNTjwWrOVWIqAhEDnFDuvlIUYi3E3vDrANW7JaLrQwPA__&Key-Pair-Id=K38HBHX5LX3X2H' -o app/src/main/res/raw/safir_intro.mp4

      - name: Wire intro and clean Home
        run: python3 scripts/wire_intro.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafirScanner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
